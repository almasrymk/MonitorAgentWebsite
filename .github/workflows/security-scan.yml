name: Security scan (DAST)

# OWASP ZAP against the running API (docker compose: SQL Server, Mailpit, API). Nightly and on demand, because it
# needs the whole stack and takes several minutes. Fails on any High-risk finding.
on:
  schedule:
    - cron: '41 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Start the stack
        run: |
          echo "SQL_SA_PASSWORD=Zap!$(openssl rand -hex 12)Aa1" > .env
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -fsS http://localhost:5200/health/ready && break
            sleep 5
          done
          curl -fsS http://localhost:5200/health/ready
      - name: ZAP API scan from the OpenAPI document
        uses: zaproxy/action-api-scan@77dfa9a647bb0f583e39d4df8531634d6ddd8df4 # v0.9.0
        with:
          target: http://localhost:5200/openapi/v1.json
          format: openapi
          allow_issue_writing: false
          fail_action: false
          cmd_options: '-a'
      - name: No high-risk findings
        run: |
          high=$(jq '[.site[].alerts[] | select(.riskcode == "3")] | length' report_json.json)
          jq -r '.site[].alerts[] | "\(.riskdesc): \(.name) (\(.count))"' report_json.json
          test "$high" -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
      - name: Stop the stack
        if: always()
        run: docker compose logs api | tail -200; docker compose down -v
