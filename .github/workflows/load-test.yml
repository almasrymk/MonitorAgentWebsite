name: Load test

# k6 against the docker compose stack. On demand only: it runs for several minutes and a shared CI runner gives
# rough numbers. Run it against staging for numbers that count (see tests/load/README.md).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the stack
        run: |
          echo "SQL_SA_PASSWORD=Load!$(openssl rand -hex 12)Aa1" > .env
          echo "SANDBOX_SECRET=$(openssl rand -hex 32)" >> .env
          docker compose -f docker-compose.yml -f tests/load/compose.load.yml up -d --build
          for i in $(seq 1 60); do curl -fsS http://localhost:5200/health/ready && break; sleep 5; done
          curl -fsS http://localhost:5200/health/ready
          grep SANDBOX_SECRET .env | sed 's/^/LOAD_/' >> "$GITHUB_ENV"
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
      - name: Run
        run: k6 run -e BASE_URL=http://localhost:5200 -e SANDBOX_SECRET="$LOAD_SANDBOX_SECRET" --summary-export=k6-summary.json tests/load/website.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: k6-summary
          path: k6-summary.json
      - name: Stop the stack
        if: always()
        run: docker compose logs api | tail -100; docker compose down -v
