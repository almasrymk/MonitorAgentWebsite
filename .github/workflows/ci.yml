name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore (fails on high or critical vulnerable packages)
        run: dotnet restore
      - name: Build (warnings are errors)
        run: dotnet build --no-restore -c Release
      - name: Unit, architecture and API tests
        run: dotnet test --no-build -c Release --collect:"XPlat Code Coverage" --results-directory coverage
      - name: Coverage of Domain and Application is at least 80%
        run: python3 scripts/ci/coverage-gate.py "$(find coverage -name coverage.cobertura.xml | head -1)" 80

  # The same API tests on a real SQL Server, each test class in its own database built by the real migrations: catches
  # what SQLite can't (migrations, SQL Server's own errors, locking and isolation, date and decimal handling).
  backend-sqlserver:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-${{ github.run_id }}-Aa1
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Ci-${{ github.run_id }}-Aa1 -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: API tests on SQL Server
        run: dotnet test -c Release
        env:
          TEST_SQLSERVER: Server=localhost,1433;User Id=sa;Password=Ci-${{ github.run_id }}-Aa1;TrustServerCertificate=True

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Dependency audit (shipped code high+, build tooling critical)
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical
      - name: Tests
        run: |
          for p in site portal admin; do npx ng test $p --watch=false; done
          npx ng test shared --watch=false --coverage
      - name: Build
        run: |
          for p in shared site portal admin; do npx ng build $p; done
      - name: Browsers for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility tests (axe, desktop and mobile)
        run: npx playwright test
        env:
          CI: 'true'
      - name: Lighthouse (performance 90+, LCP under 2.5 s, CLS under 0.1 on the public site)
        run: npx --yes @lhci/cli@0.15.1 autorun
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse
          path: web/lighthouse-results
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: API image builds
        run: docker build -f src/Host/MonitorAgent.Api/Dockerfile -t monitoragent-api:ci .
      - name: Image has no fixable critical or high vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: monitoragent-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Software bill of materials (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: monitoragent-api:ci
          format: spdx-json
          output-file: sbom-api.spdx.json
          upload-artifact: true
      - name: Web images build (site renderer and edge)
        run: |
          docker build -f deploy/web.Dockerfile --target site -t monitoragent-site:ci .
          docker build -f deploy/web.Dockerfile --target edge -t monitoragent-edge:ci .
      - name: Site image has no fixable critical or high vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: monitoragent-site:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Edge image has no fixable critical or high vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: monitoragent-edge:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  # The whole production stack from deploy/ (Caddy, site, API, SQL Server), checked through the front door.
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Start the stack
        working-directory: deploy
        run: |
          sa="Ci-$(openssl rand -hex 12)-1a!"
          keypass="$(openssl rand -hex 16)"
          mkdir keys
          openssl req -x509 -newkey rsa:3072 -nodes -days 30 -subj "/CN=MonitorAgent data protection (CI)" -keyout keys/key.pem -out keys/cert.pem
          openssl pkcs12 -export -inkey keys/key.pem -in keys/cert.pem -out keys/dataprotection.pfx -passout "pass:$keypass"
          rm keys/key.pem keys/cert.pem && chmod 644 keys/dataprotection.pfx
          {
            echo "DOMAIN=localhost"
            echo "ACME_EMAIL=ops@example.test"
            echo "SITE_HOST=localhost"
            echo "SQL_SA_PASSWORD=$sa"
            echo "ConnectionStrings__Default=Server=sqlserver;Database=MonitorAgentWebsite;User Id=sa;Password=$sa;TrustServerCertificate=True"
            echo "Portal__Url=https://localhost/portal"
            echo "Email__Provider=Smtp"
            echo "Email__Smtp__Host=smtp.invalid"
            echo "Email__Smtp__From=no-reply@example.test"
            echo "Licenses__Platform__BaseUrl=http://licensing-platform.invalid"
            echo "Identity__KeyProtection__CertificatePassword=$keypass"
          } > .env
          docker compose --profile db up -d --build
      - name: Smoke test through the front door
        run: scripts/ci/stack-smoke.sh
      - name: Logs
        if: failure()
        working-directory: deploy
        run: docker compose --profile db logs --no-color

  # Semgrep's community rules for C#, TypeScript and secrets. Fails on ERROR findings (the plan's zero Critical/High);
  # warnings stay visible in the log. CodeQL (codeql.yml) covers the deeper data-flow checks.
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Semgrep
        run: python3 -m pip install --user semgrep==1.180.0
      - name: Scan
        run: >-
          semgrep scan --metrics off --error --severity ERROR
          --config p/csharp --config p/typescript --config p/secrets --config p/github-actions
          --exclude "**/Migrations/**" --exclude "**/*.spec.ts"

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
