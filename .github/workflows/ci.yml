name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore (fails on high or critical vulnerable packages)
        run: dotnet restore
      - name: Build (warnings are errors)
        run: dotnet build --no-restore -c Release
      - name: Unit, architecture and API tests
        run: dotnet test --no-build -c Release --collect:"XPlat Code Coverage"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Dependency audit (shipped code high+, build tooling critical)
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical
      - name: Tests
        run: |
          for p in site portal admin shared; do npx ng test $p --watch=false; done
      - name: Build
        run: |
          for p in shared site portal admin; do npx ng build $p; done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: API image builds
        run: docker build -f src/Host/MonitorAgent.Api/Dockerfile .

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
