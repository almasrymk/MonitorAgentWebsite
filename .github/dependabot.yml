# Weekly update pull requests for every dependency the build ships or runs (supply-chain plan, ADR-015).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly }
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
    # The app targets net10.0 (LTS); moving to .NET 11 is a deliberate upgrade, not a weekly bump.
    ignore:
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "@schematics/angular"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /src/Host/MonitorAgent.Api
    schedule: { interval: weekly }
    # Stay on the .NET 10 images while the app targets net10.0.
    ignore:
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
