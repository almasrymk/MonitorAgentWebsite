# Local development stack: SQL Server and the API. Copy .env.example to .env and set a strong SA password first.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql

  # Catches every email the API sends in development. Inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: src/Host/MonitorAgent.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Server=sqlserver;Database=MonitorAgentWebsite;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
      Email__Smtp__Host: mailpit
    ports:
      - "5200:8080"
    depends_on:
      - sqlserver
      - mailpit

volumes:
  sqldata:
